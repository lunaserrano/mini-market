<p-confirmdialog />

<div class="flex justify-between items-center mb-4">
  <h1 class="text-xl font-bold">Categorías</h1>
  <p-button label="Nueva categoría" icon="pi pi-plus" (onClick)="nueva()" />
</div>

<div class="mm-table-wrap">
<p-table [value]="categorias()" [loading]="cargando()" styleClass="p-datatable-sm" [paginator]="true" [rows]="15">
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Estado</th>
      <th style="width: 100px"></th>
    </tr>
  </ng-template>
  <ng-template #body let-categoria>
    <tr>
      <td>{{ categoria.nombre }}</td>
      <td>{{ categoria.descripcion }}</td>
      <td>
        <p-tag [value]="categoria.estado === 'A' ? 'Activa' : 'Inactiva'" [severity]="categoria.estado === 'A' ? 'success' : 'danger'" />
      </td>
      <td>
        <div class="flex gap-1">
          <p-button icon="pi pi-pencil" [text]="true" (onClick)="editar(categoria)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmarDesactivar(categoria)" />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
</div>

<p-dialog [header]="editandoId ? 'Editar categoría' : 'Nueva categoría'" [(visible)]="mostrarFormulario" [modal]="true" [style]="{ width: '24rem' }">
  <div class="flex flex-col gap-3">
    <div class="flex flex-col gap-1">
      <label class="text-sm">Nombre</label>
      <input pInputText [(ngModel)]="formulario.nombre" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-sm">Descripción</label>
      <input pInputText [(ngModel)]="formulario.descripcion" />
    </div>
  </div>
  <ng-template #footer>
    <p-button label="Guardar" icon="pi pi-check" (onClick)="guardar()" />
  </ng-template>
</p-dialog>
